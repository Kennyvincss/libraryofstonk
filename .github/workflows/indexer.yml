name: Archive indexer

# Builds the real-data archive from GeckoTerminal and publishes it to the
# `data` branch, which the site reads (VITE_ARCHIVE_DATA_URL).
on:
  schedule:
    - cron: '17 * * * *' # hourly
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'API call budget for this run (free tier ≈ 27/min)'
        required: false
        default: '600'
      max_minutes:
        description: 'Stop spending API calls after this many minutes, then publish'
        required: false
        default: '32'

permissions:
  contents: write

concurrency:
  group: archive-indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore previous dataset (data branch)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            mkdir -p data-out
            git --work-tree=data-out checkout origin/data -- .
            git reset -q
          else
            mkdir -p data-out
          fi
          ls data-out || true

      - name: Run indexer
        env:
          INDEXER_MAX_CALLS: ${{ github.event.inputs.max_calls || '600' }}
          INDEXER_MAX_MINUTES: ${{ github.event.inputs.max_minutes || '32' }}
          # optional: complete on-chain enumeration (Settings → Secrets → Actions)
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: npx tsx indexer/main.ts --out data-out

      - name: Publish to data branch
        run: |
          cd data-out
          git init -q -b data
          git config user.name "stonkfun-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          cat > README.md <<'MD'
          # STONKFUN ARCHIVE dataset
          Generated by `.github/workflows/indexer.yml` on the main branch. Do not edit by hand.
          MD
          # data only: no site to build here (stops Vercel deploying this branch)
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git add -A
          git commit -q -m "Archive dataset $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # single-commit branch: history lives in the files, not in git
          git push -q -f origin data
          echo "published $(du -sh . | cut -f1)"
